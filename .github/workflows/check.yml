# Verificação completa (`npm run check`) em todo PR e a cada envio para a main:
# Biome, tipos, Vitest e os testes no navegador (Playwright, com o Chromium).
name: Verificação

on:
  pull_request:
  push:
    branches: [main]

# Um envio novo para o mesmo PR cancela a verificação anterior, que já não vale.
concurrency:
  group: verificacao-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: Lint, tipos, testes e navegador
        run: npm run check

      # Os prints das telas e o que o Playwright guardou da falha, para ver o que quebrou.
      - name: Guardar os resultados do navegador (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # TEMPORÁRIO (será removido antes do PR ficar pronto): prints da tela Caminhos para o PR da Fase 3.
      - name: Guardar os prints da Fase 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prints-fase-3
          path: |
            test-results/telas/**/caminhos*.png
            test-results/telas/**/painel-formula.png
            test-results/telas/**/painel-fim-de-temporada.png
          retention-days: 3
          if-no-files-found: warn
